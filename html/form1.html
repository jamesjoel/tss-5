<!--  there are 11 tag inside of form tag (HTML v4)  
    
    1. textbox      -- name, email, contact etc
    2. password
    3. radio button
    4. checkbox
    5. select-option / dropdown
    6. textarea
    7. button
    8. reset
    9. submit
    10. file
    11. hidden

-->
<html>
    <head>

    </head>
    <body>
        <h1>Form in HTML</h1>
        <form>
            <input type="hidden" />
            <input type="text" placeholder="Full Name" />
            <br />
            <br />
            <input type="password" placeholder="Insert Your Password" />
            <br />
            <br />
            Gender : Male<input type="radio" name="gender" />
                    Female<input type="radio" name="gender"/>
            <br />
            <br />
            Hobby : Cricket<input type="checkbox" />
                    Football<input type="checkbox" />
                    Music<input type="checkbox" />
            <br />
            <br />
            <select>
                <option>Select Your City</option>
                <option>Indore</option>
                <option>Mumbai</option>
                <option>Pune</option>
                <option>Delhi</option>
            </select>
            <br />
            <br />
            <input type="file" />
            <br />
            <br />
            <textarea rows="5" cols="30" placeholder="Insert Your Address"></textarea>
            <br />
            <br />
            <input type="button" value="OK"/>
            <br />
            <br />
            <input type="reset" value="Clear" />
            <br />
            <br />
            <input type="submit" value="Registration" />


            

        </form>
    </body>
</html>
