<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <script src="js/bootstrap.bundle.js"></script>
    <style>
        .bg-gray{
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                
                <div class="card border border-primary">
                    <div class="card-header bg-primary">
                        <h3 class="text-light">Registration</h3>
                    </div>
                    <div class="card-body bg-gray">
                        <div class="my-2">
                            <label class="mb-2">Full Name</label>
                            <input type="text" class="form-control" />
                        </div>
                        <div class="my-2">
                            <label class="mb-2">Email</label>
                            <input type="text" class="form-control" />
                        </div>
                        <div class="my-2">
                            <label class="mb-2">Password</label>
                            <input type="password" class="form-control" />
                        </div>
                        <div class="my-2">
                            <label class="mb-2">City</label>
                            <select class="form-control">
                                <option>Select City</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-footer bg-primary">
                        <button class="btn btn-light">Signup</button>
                        <button data-bs-toggle="modal" data-bs-target="#login" class="btn btn-light">Login</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="login">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark">
                    <h3 class="text-light">Login</h3>
                </div>
                <div class="modal-body  bg-dark">
                    <div class="my-2">
                        <label class="text-light mb-3">Username/Email</label>
                        <input type="text" class="form-control" />
                    </div>
                    <div class="my-2">
                        <label class="text-light mb-3">Password</label>
                        <input type="password" class="form-control" />
                    </div>
                    
                </div>
                <div class="modal-footer  bg-dark">
                    <button class="btn btn-primary">Login</button>
                    <button data-bs-dismiss="modal" class="btn btn-danger">Close</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
