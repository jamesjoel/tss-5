<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #1B211A;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .navbar{
            width: 100%;
            
            /* background-color: #628141; */
            background-image: linear-gradient(#3A3A3A, #161617);
            height: 80px;
            padding-top: 30px;
        }
        .container{
            width: 85%;
            margin: 0 auto;
        }
        .nav{
            width: 650px;
            height: 60px;
            background-color: #fff;
            padding: 10px;
        }
        .nav ul{
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
            height: 60px;
            justify-content: space-between;
            align-items: center;
        }
        .nav ul li a{
            /* background-color: red; */
            margin: 10px;
            text-decoration: none;
            font-size: 20px;
            padding: 10px 15px;
            color: #1B211A;
            transition: .5s;
            border-radius: 8px;
        }
        .nav ul li a:hover{
            background-color: #1B211A;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="container">
            <div class="nav">
                <ul>
                    <li>
                        <a href="http://google.com">Home</a>
                    </li>
                    <li>
                        <a href="">About</a>
                    </li>
                    <li>
                        <a href="">Contact</a>
                    </li>
                    <li>
                        <a href="">Help</a>
                    </li>
                    <li>
                        <a href="">Services</a>
                    </li>
                    <li>
                        <a href="">Services</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
