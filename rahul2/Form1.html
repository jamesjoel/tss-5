<!-- there are 11 tag inside of form tag (HTML v4)

     1.  textbox     -- name, email, contact etc 
     2.  password 
     3.  radio button
     4.  checkbox
     5.  select option / dropdown
     6.  textarea
     7.  button
     8.  reset
     9.  submit
     10. File
     11. hidden


-->
<html>
    <head>

    </head>
    <body>

        <form>
            <input type="text" placeholder="Full Name" />
            <br />
            <br />
            <input type="password" placeholder="Enter Your Password" />
            <br />
            <br />
            Gender : Male<input type="radio" name="gender" />
                    Female<input type="radio" name="gender" />
            <br />
            <br />

            <br />

                <option>Pune</option>

            </select>
            <br />
            <br />

            <br />
            <br />

            <br />

            <br />
