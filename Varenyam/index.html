<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NeoCore Interface</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #0f2027, #000);
      overflow: hidden;
      color: #fff;
    }

    /* ANIMATED BACKGROUND */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(0, 255, 255, 0.15),
        rgba(255, 0, 255, 0.15),
        rgba(0, 255, 150, 0.15)
      );
      animation: bgShift 10s linear infinite;
      z-index: -1;
    }

    @keyframes bgShift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    /* HEADER */
    header {
      padding: 30px;
      text-align: center;
      letter-spacing: 4px;
      font-size: 1.5rem;
      color: #00fff0;
      text-shadow: 0 0 10px #00fff0;
    }

    /* MAIN PANEL */
    .panel {
      max-width: 1000px;
      margin: auto;
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
    }

    .card h2 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: #00fff0;
    }

    .value {
      font-size: 2.2rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }

    /* BUTTON */
    .control {
      margin-top: 40px;
      text-align: center;
    }

    button {
      padding: 14px 40px;
      font-size: 1rem;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      color: #000;
      background: linear-gradient(90deg, #00fff0, #00ff88);
      box-shadow: 0 0 20px #00fff0;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 40px #00fff0;
    }

    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <header>NEOCORE SYSTEM INTERFACE</header>

  <section class="panel">
    <div class="card">
      <h2>POWER LEVEL</h2>
      <div class="value" id="power">87%</div>
    </div>

    <div class="card">
      <h2>CPU LOAD</h2>
      <div class="value" id="cpu">42%</div>
    </div>

    <div class="card">
      <h2>NETWORK SYNC</h2>
      <div class="value" id="net">ONLINE</div>
    </div>

    <div class="card">
      <h2>CORE TEMP</h2>
      <div class="value" id="temp">63°C</div>
    </div>
  </section>

  <div class="control">
    <button onclick="boost()">BOOST SYSTEM</button>
  </div>

  <footer>© 2049 NeoCore Industries</footer>

  <script>
    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function updateStats() {
      document.getElementById("power").textContent = rand(70, 100) + "%";
      document.getElementById("cpu").textContent = rand(30, 90) + "%";
      document.getElementById("temp").textContent = rand(50, 80) + "°C";
    }

    function boost() {
      document.body.style.animation = "none";
      setTimeout(() => {
        document.body.style.animation = "";
      }, 10);

      document.getElementById("net").textContent = "BOOSTED";
      setTimeout(() => {
        document.getElementById("net").textContent = "ONLINE";
      }, 1500);
    }

    setInterval(updateStats, 2000);
  </script>
</body>
</html>
